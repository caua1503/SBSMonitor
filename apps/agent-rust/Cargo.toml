[package]
name = "sbsmonitor-agent-rust"
version = "0.1.0"
edition = "2021"
description = "SBSMonitor agent for legacy Windows (XP and later)"
license = "UNLICENSED"

[dependencies]
dotenvy = "0.15"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
thiserror = "2"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
url = "2"
webpki-roots = "1"
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[build-dependencies]
thunk-rs = { version = "0.3.5", default-features = false, features = ["xp", "vc_ltl_only"] }
